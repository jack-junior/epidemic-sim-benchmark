[project]
name = "epidemic-sim-benchmark"
version = "0.1.0"
description = "Epidemic simulation benchmark for ECS and Mesa agent-based models"
authors = [
    {name = "mlrx-potindji",email = "malraux.potindji@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "mesa (>=3.5.0,<4.0.0)",
    "networkx (>=3.0,<4.0)",  # imported by mesa 3.5 but not declared by it
    "esper (>=3.7,<4.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "scipy (>=1.14.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "ema-workbench (>=2.5.3,<3.0.0)"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemic_sim"]

[dependency-groups]
dev = [
    "pytest (>=8.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical parity tests over replicated runs"]
